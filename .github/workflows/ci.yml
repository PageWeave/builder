name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Bundle-only job — skip the ~100MB Electron binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  smoke:
    # Full boot: launches the built app under a virtual display and asserts
    # the renderer→main→engine ping-pong self-check log. --no-sandbox is a
    # CI-only flag (Chromium's OS sandbox needs more privileges than CI
    # users have) — never shipped in packaged builds.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install runtime libs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgtk-3-0t64 libnss3 libasound2t64 xvfb || \
            sudo apt-get install -y libgtk-3-0 libnss3 libasound2 xvfb
      - name: Boot smoke
        run: |
          set -o pipefail
          PW_SMOKE=1 timeout 60 xvfb-run -a npx electron . --no-sandbox 2>&1 | tee boot.log
          grep -q "\[pw\] engine pong ok" boot.log
          grep -q "\[pw\] window created" boot.log

  e2e:
    # Full product-loop smoke via Playwright _electron under a virtual
    # display, with PW_E2E=1 IPC stubs (canned auth/model/sites + canned
    # prompt events). The real engine process boots; no network, keyring, or
    # browser needed. --no-sandbox is CI-only (see smoke job).
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install runtime libs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgtk-3-0t64 libnss3 libasound2t64 xvfb || \
            sudo apt-get install -y libgtk-3-0 libnss3 libasound2 xvfb
      - name: Run E2E
        run: xvfb-run -a npx playwright test
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 3

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks-action (v2/v3) requires a GITLEAKS_LICENSE key for org
      # repos; the CLI itself is MIT and license-free. Pinned release for
      # deterministic rule sets — bump deliberately.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Secret scan (full history)
        run: ./gitleaks detect --source . --no-banner --redact --verbose --exit-code 1

  package:
    # M5: build the actual distribution bundle (asar + fuses + node_modules
    # subset) with electron-builder --dir, then boot THAT binary — catches
    # packaging regressions (missing files, asar pathing, dep resolution)
    # the unpackaged smoke cannot. Linux dir-build boots the same bundle
    # layout the mac/win installers ship.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Package (dir)
        run: npm run dist:dir
      - name: Install runtime libs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgtk-3-0t64 libnss3 libasound2t64 xvfb || \
            sudo apt-get install -y libgtk-3-0 libnss3 libasound2 xvfb
      - name: Packaged boot smoke
        run: |
          set -o pipefail
          PW_SMOKE=1 timeout 60 xvfb-run -a "./release/linux-unpacked/pageweave-builder" --no-sandbox 2>&1 | tee boot.log
          grep -q "\[pw\] engine pong ok" boot.log
          grep -q "\[pw\] window created" boot.log
