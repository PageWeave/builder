name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Bundle-only job — skip the ~100MB Electron binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  smoke:
    # Full boot: launches the built app under a virtual display and asserts
    # the renderer→main→engine ping-pong self-check log. --no-sandbox is a
    # CI-only flag (Chromium's OS sandbox needs more privileges than CI
    # users have) — never shipped in packaged builds.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install runtime libs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgtk-3-0t64 libnss3 libasound2t64 xvfb || \
            sudo apt-get install -y libgtk-3-0 libnss3 libasound2 xvfb
      - name: Boot smoke
        run: |
          set -o pipefail
          PW_SMOKE=1 timeout 60 xvfb-run -a npx electron . --no-sandbox 2>&1 | tee boot.log
          grep -q "\[pw\] engine pong ok" boot.log
          grep -q "\[pw\] window created" boot.log

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
